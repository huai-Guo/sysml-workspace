[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-workspace"
version = "0.1.0"
description = "A unified SysML v2 workbench: Code, Diagram, and Agent Co-pilot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.2.12,<1.3",
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.0,<3",
]

[project.scripts]
sysml-workspace = "sysml_workspace.cli:main"
sysml-workspace-web = "sysml_workspace.web.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sysml_workspace.server" = ["migrations/*.sql", "static/*", "static/dist/*"]
"sysml_workspace.knowledge" = ["service/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
